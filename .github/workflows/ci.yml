name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer run on the same ref cancels a stale in-progress one — a hung step
# (e.g. a flaky apt mirror) never burns runner hours after a retrigger push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Explicit, not github.repository: the repo was renamed
  # soult-io/payroll-app -> soult-io/wagon-payroll (PAY-68) and GHCR packages do
  # not follow a rename. The legacy ghcr.io/soult-io/payroll-app got its last
  # release tag at v1.25.0 and its last sha-* tag at the PAY-68 step 3 merge;
  # nothing is pushed to it after that. Its old tags stay pullable. Never delete the old package.
  IMAGE_NAME: soult-io/wagon-payroll

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint + format (biome)
        run: pnpm lint

      # PAY-108: every server suite importing src/deposits or src/filings must
      # match its mutation target's testFiles globs (apps/server/stryker.targets.mjs).
      - name: Mutation test globs cover every importing suite
        run: pnpm check:mutation-globs

      # Build BEFORE typecheck: cross-package imports resolve to dist/*.d.ts,
      # which must exist first (locally, stale dist dirs mask this).
      - name: Build web + server + packages
        run: pnpm -r run build

      - name: Typecheck (all packages)
        run: pnpm -r run typecheck

      # Spec 17 §2: also write the vitest json report (kept alongside the
      # console reporter) so the verify-summary job can assemble the summary.
      - name: Engine unit tests + coverage (regression oracle — spec 2)
        run: pnpm --filter @payroll/engine exec vitest run --coverage --reporter=default --reporter=json --outputFile.json="$GITHUB_WORKSPACE/verify-artifacts/vitest-engine.json"

      - name: Server integration tests + coverage (PGlite — spec 2/3/4/6)
        run: pnpm --filter @payroll/server exec vitest run --coverage --reporter=default --reporter=json --outputFile.json="$GITHUB_WORKSPACE/verify-artifacts/vitest-server.json"

      # Upload even when a suite failed (spec 17 §2: emit on pass AND fail).
      - name: Upload vitest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-reporters
          path: verify-artifacts/
          # warn (not ignore): a missing reporter is a producer bug worth surfacing.
          if-no-files-found: warn
          retention-days: 7

      - name: Build container image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} .

  # Browser E2E (hardening B): real SPA + Fastify on PGlite, Playwright
  # chromium. Runs in parallel with verify; push-image waits for both.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # fail fast on hangs — never sit on the 6h default
    # Official Playwright image matching the lockfile version: chromium AND its
    # system libraries are baked in. This removes the two per-run network
    # dependencies that hang under flaky infrastructure: `playwright install
    # --with-deps` (apt against azure.archive.ubuntu.com — hung twice on
    # 2026-08-19) and the browser CDN download.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web + packages (SPA dist + workspace dists)
        run: pnpm -r run build

      # NO --with-deps: system libs are preinstalled in the image. This step
      # only verifies the browser is present (no-op when versions match).
      - name: Verify Playwright chromium
        run: pnpm --filter @payroll/e2e exec playwright install chromium

      - name: E2E (Playwright journeys)
        run: pnpm --filter @payroll/e2e e2e

      # Spec 17 §2: always upload the Playwright json + html report (pass AND
      # fail) for the verify-summary job and the pay-verify site.
      - name: Upload Playwright report + json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reporters
          path: |
            e2e/playwright-results.json
            e2e/playwright-report/
          # warn (not ignore): a missing json report is a producer bug worth surfacing.
          if-no-files-found: warn
          retention-days: 7

      # Spec 20 (PAY-78): journey evidence — journey-evidence.json + one still
      # per step. Paths inside the json are relative to test-results/, which
      # upload-artifact keeps as the artifact root (least common ancestor).
      # Pass AND fail: a failed card opens on its failing step's still.
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pay-verify-evidence
          path: |
            e2e/test-results/journey-evidence.json
            e2e/test-results/**/attachments/step-still-*.jpg
          if-no-files-found: warn
          retention-days: 7

  # Spec 17 §2 (PAY-43): assemble the versioned, PII-free result summary from
  # the verify + e2e reporter artifacts and publish it (with the html report)
  # on EVERY run — the ingest source of truth for the pay-verify site (PAY-44).
  # This job never gates merge; the test gate stays on verify + e2e.
  verify-summary:
    needs: [verify, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build verify-summary
        run: pnpm --filter @payroll/verify-summary run build

      - name: Download vitest reports
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: verify-reporters
          path: _reporters/verify

      - name: Download e2e reports
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: e2e-reporters
          path: _reporters/e2e

      - name: Assemble summary
        run: |
          node packages/verify-summary/dist/cli.js \
            --source ci \
            --out verify-artifacts/summary.json \
            --vitest engine=_reporters/verify/vitest-engine.json \
            --vitest server=_reporters/verify/vitest-server.json \
            --playwright e2e=_reporters/e2e/playwright-results.json \
            --require engine,server,e2e
          if [ -d _reporters/e2e/playwright-report ]; then
            cp -r _reporters/e2e/playwright-report verify-artifacts/playwright-report
          fi

      - name: Upload verify summary + report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pay-verify-summary
          path: verify-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  push-image:
    # Image is pushed only from main (spec 8/13). This repo is artifact-only:
    # CI publishes sha-<full-sha> + latest tags and nothing here touches any
    # deployment — prod moves via release.yml + a pin PR in the stack repo.
    # E2E gates the push: the image carries exactly what the journeys exercise.
    needs: [verify, e2e]
    # Repo gate: the image names are explicit soult-io/* packages (PAY-68), which
    # a fork's GITHUB_TOKEN cannot push to — a fork's main push skips this job.
    if: github.repository == 'soult-io/wagon-payroll' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      packages: write
      security-events: write   # Trivy SARIF upload to code scanning
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image vulnerability gate: fail on CRITICAL (fixed) findings, table output
      # to the job log. SARIF upload to code scanning only works when GitHub
      # Advanced Security is available (public repos or GHAS) — gated below.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy image scan (SARIF for code scanning)
        if: github.event.repository.visibility == 'public'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
